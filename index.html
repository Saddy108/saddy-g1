<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Arcade</title>
    <style>
        /* Modern Dark Theme & Variables */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --border: #334155;
            --ready: #10b981;
            --soon: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Responsive Grid for Games */
        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        /* Game Card Styling */
        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px 25px;
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 15px 30px -10px var(--accent-glow);
        }

        .game-icon {
            font-size: 4rem;
            margin-bottom: 5px;
            transition: transform 0.3s;
        }

        .game-card:hover .game-icon {
            transform: scale(1.1);
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .game-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
            flex-grow: 1; /* Pushes the button to the bottom */
        }

        /* Status Badge (Ready vs Coming Soon) */
        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-ready {
            background: rgba(16, 185, 129, 0.15);
            color: var(--ready);
        }

        .status-soon {
            background: rgba(245, 158, 11, 0.15);
            color: var(--soon);
        }

        /* Play Button */
        .play-btn {
            background-color: var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .game-card.ready:hover .play-btn {
            background-color: var(--accent);
            color: white;
        }

        /* Make unready games look disabled */
        .game-card.soon {
            opacity: 0.7;
            pointer-events: none; /* Prevents clicking */
        }

    </style>
</head>
<body>

    <header>
        <h1>My Web Arcade</h1>
        <p>Select a game to start playing</p>
    </header>

    <!-- The games will be automatically injected into this grid by the JavaScript below -->
    <div class="arcade-grid" id="gameGrid"></div>

    <script>
        // =====================================================================
        // 🎮 HOW TO ADD A NEW GAME:
        // Just copy one of the lines below, change the details, and add it to the list!
        // status can be "ready" (clickable) or "soon" (unclickable).
        // =====================================================================

        const games = [
            { 
                title: "Sudoku Pro", 
                icon: "🔢", 
                desc: "Classic number puzzle with multiple difficulties and notes.", 
                file: "sudoku.html", 
                status: "ready" 
            },
            { 
                title: "Math Genius", 
                icon: "➕", 
                desc: "Test your brain with quick-fire math challenges.", 
                file: "math.html", 
                status: "ready" 
            },
            { 
                title: "Word Connect", 
                icon: "🔤", 
                desc: "Swipe letters to build words and clear the board.", 
                file: "words.html", 
                status: "ready" 
            },
            { 
                title: "Retro Snake", 
                icon: "🐍", 
                desc: "Eat the apples and grow bigger without hitting the walls.", 
                file: "snake.html", 
                status: "soon" 
            },
            { 
                title: "Memory Match", 
                icon: "🃏", 
                desc: "Flip the cards and find the matching pairs before time runs out.", 
                file: "memory.html", 
                status: "soon" 
            }
        ];

        // =====================================================================
        // DO NOT EDIT BELOW THIS LINE - This code builds the UI automatically
        // =====================================================================

        const grid = document.getElementById('gameGrid');

        games.forEach(game => {
            // Determine button text and badge based on status
            const isReady = game.status === "ready";
            const badgeClass = isReady ? "status-ready" : "status-soon";
            const badgeText = isReady ? "Ready to Play" : "Coming Soon";
            const btnText = isReady ? "Play Now ➔" : "In Development";

            // Create the card link
            const card = document.createElement('a');
            card.href = isReady ? game.file : "#";
            card.className = `game-card ${game.status}`;
            
            // Inject the HTML for the card
            card.innerHTML = `
                <div class="status-badge ${badgeClass}">${badgeText}</div>
                <div class="game-icon">${game.icon}</div>
                <div class="game-title">${game.title}</div>
                <div class="game-desc">${game.desc}</div>
                <div class="play-btn">${btnText}</div>
            `;

            grid.appendChild(card);
        });
    </script>
</body>
</html>
